<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexus Translation Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  textarea { width: 100%; height: 120px; padding: 10px; font-size: 16px; }
  select, button { padding: 8px 12px; font-size: 15px; margin-top: 10px; }
  #output { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 6px; min-height: 60px; white-space: pre-wrap; }
  label { display: block; margin-top: 15px; font-weight: 600; }
</style>
</head>
<body>
  <h1>Nexus Translation Demo</h1>

  <label for="sourceText">Text to translate</label>
  <textarea id="sourceText" placeholder="Enter text here..."></textarea>

  <label for="targetLang">Target language</label>
  <select id="targetLang">
    <option value="hin_Deva">Hindi</option>
    <option value="guj_Gujr">Gujarati</option>
    <option value="ben_Beng">Bengali</option>
    <option value="tam_Taml">Tamil</option>
  </select>

  <br>
  <button onclick="translate()">Translate</button>

  <div id="output">Translation will appear here.</div>

<script>
async function translate() {
  const text = document.getElementById('sourceText').value;
  const targetLang = document.getElementById('targetLang').value;
  const output = document.getElementById('output');

  if (!text.trim()) {
    output.textContent = 'Please enter some text first.';
    return;
  }

  output.textContent = 'Translating...';

  try {
    // Adjust this URL/payload to match your actual backend API route
    const res = await fetch('http://localhost:8000/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, target_lang: targetLang })
    });

    if (!res.ok) throw new Error('Request failed: ' + res.status);

    const data = await res.json();
    output.textContent = data.translated_text || JSON.stringify(data);
  } catch (err) {
    output.textContent = 'Error: ' + err.message + ' (is the backend running on localhost:8000?)';
  }
}
</script>
</body>
</html>
